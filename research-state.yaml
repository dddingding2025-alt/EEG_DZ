current_findings:
  - "近五年模型结构创新已从 CNN/RNN/Transformer 层面转向泛化、标注噪声、自监督预训练、任意传感器和临床可用性。"
  - "Sleep-EDF 上的高准确率不应直接解释为临床可用；跨数据集、跨设备、跨年龄/疾病人群更能暴露真实问题。"
  - "N1、转期片段和人工标注分歧是最稳定的难点，也是比继续堆模型更有研究价值的切入点。"
recommended_next_direction:
  title: "标签不确定性 + 跨数据集泛化的 EEG 睡眠分期"
  rationale: "同时命中临床标注分歧、N1 难分类和跨数据集性能下降三类核心痛点，实验成本适中。"
  current_focus: "N1 与转期 epoch 的 label uncertainty，不把 class imbalance、label uncertainty、domain shift 混为同一问题。"
next_steps:
  - "先用 Sleep-EDF + ISRUC 设计最小实验协议，不下载数据、不训练模型前先锁定预处理和指标。"
  - "比较 hard CE、class-weighted CE、focal loss、stage-adjacent smoothing、transition-aware smoothing。"
  - "主评测使用 N1 F1、REM F1、macro-F1、kappa、transition-window F1 和 ECE/calibration。"
