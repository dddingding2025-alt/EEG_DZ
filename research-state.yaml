current_findings:
  - "近五年模型结构创新已从 CNN/RNN/Transformer 层面转向泛化、标注噪声、自监督预训练、任意传感器和临床可用性。"
  - "Sleep-EDF 上的高准确率不应直接解释为临床可用；跨数据集、跨设备、跨年龄/疾病人群更能暴露真实问题。"
  - "N1、转期片段和人工标注分歧是最稳定的难点，也是比继续堆模型更有研究价值的切入点。"
recommended_next_direction:
  title: "transition-centered evaluation + lightweight sequence regularization for EEG sleep staging"
  rationale: "用户选择转期感知长上下文作为第一篇文章方向；最佳切口是评估和改善 hypnogram 边界行为，而不是提出另一个长上下文 Transformer。"
  current_focus: "比较不同上下文长度对不同阶段转换的帮助，并用轻量 transition-aware regularization 减少边界错误。"
next_steps:
  - "实现 hypnogram transition metrics。"
  - "准备 Sleep-EDF subject-independent baseline。"
  - "比较 single epoch、5 min、30 min、90 min、full-night context。"
  - "加入 transition-aware sample weighting 和 boundary-aware consistency loss。"
