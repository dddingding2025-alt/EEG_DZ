current_findings:
  - "最新统一主线是：用转期/边界不确定性同时调节标签监督和上下文建模，以提升 EEG 睡眠分期中的 N1 识别。"
  - "第一篇文章优先聚焦 N1 标签不确定性：stage-adjacent soft labels + transition-window uncertainty，而不是跨数据集泛化或大模型。"
  - "TGCM 保留为第二阶段增强模块，用于验证边界不确定样本是否也需要自适应上下文尺度。"
  - "Domain shift / 跨数据集泛化应作为 robustness check；Sleep-EDF 与 ISRUC 先分别做 within-dataset subject-independent 复现。"
  - "本机无可用 Python/GPU；训练和 smoke test 通过 GitHub + 远程服务器 SSH/tmux 协作完成，轻量结果回传 GitHub。"
recommended_next_direction:
  title: "Transition-Uncertainty Guided Soft Labels for N1 EEG Sleep Staging"
  rationale: "该方向把 N1 标签不确定性和 TGCM 的重叠点收束到同一个机制：转期/边界不确定性；主贡献清晰，实验可分阶段落地。"
  current_focus: "先锁定 unified protocol，完成数据统计和指标脚本，再跑 Sleep-EDF baseline 与 N1 soft-label 方法。"
